name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest cryptography
      - run: python -m pytest tools -q
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test mtdrop.sln --nologo
      - name: Refuse private artefacts
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(pcap|pcapng|cap|pem|key|p12|pfx|bin|sys)$|keylog'; then
            echo "private or binary artefact tracked"
            exit 1
          fi

  mt792x:
    name: mt792x (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S driver/mt792x -B build/mt792x -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/mt792x --config Release
      - name: Test
        run: ctest --test-dir build/mt792x -C Release --output-on-failure

  awdld:
    name: awdld (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S awdld -B build/awdld -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/awdld
      - name: Test
        run: ctest --test-dir build/awdld --output-on-failure
